# Blocks pull requests that ADD a secret (API key, token, password, private key).
# Free alternative to GitHub push protection, which is a paid add-on for private repos.
# Scans only the commits in the PR, so secrets already in old history do not make it red
# (those are tracked and rotated separately). Findings are redacted in the log.
# If a finding is a false positive, add its fingerprint (shown in the log) to .gitleaksignore.
name: Secret scan (PR)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan commits in this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="-1"   # manual run: latest commit only
          fi
          echo "Scanning $RANGE"
          /tmp/gitleaks git . --log-opts="$RANGE" --redact --verbose --no-banner --exit-code 1
