name: "CodeQL Security Scan"

# Weekly schedule removed to save Actions minutes. Runs on push/PR only when
# CODEQL_ENABLED=true (org/repo variable). Manual: Actions → Run workflow.

on:
  push:
    branches: [main, master, development, dev]
  pull_request:
    branches: [main, master, development, dev]
  workflow_dispatch:

jobs:
  analyze:
    uses: Unojobs/.github/.github/workflows/codeql-javascript.yml@main
